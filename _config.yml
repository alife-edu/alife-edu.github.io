title: ALife-Edu
description: "ALife-Edu is a community of educators, learners, and practitioners working to make artificial life teachable, findable, and worth teaching."
url: "https://alife-edu.github.io"
baseurl: ""

markdown: kramdown

# Upcoming events have future dates; without this Jekyll silently skips them.
future: true

collections:
  resources:
    output: false
  schedules:
    output: false
  events:
    output: true
    permalink: /:name.html

defaults:
  - scope:
      type: events
    values:
      layout: event

theme: null

# Jekyll skips files whose names start with "_" unless they're listed here.
include:
  - __AEdu-East-10-Closing.pdf

exclude:
  - Gemfile
  - Gemfile.lock
  - vendor
  - README.md
  - "AEDU event schedule.xlsx"
  - agendas-and-minutes
  - "_resources/README.md"
  - "_schedules/README.md"
  - "_events/README.md"
  - node_modules
  - scripts
