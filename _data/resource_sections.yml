# The sections of the Resources page, in the order they appear.
#
# Each section lists the files in _resources/ whose `category` matches its `category` here.
# The same list builds the Resources popup on the home page (the Life panel's Resources
# block), so adding, renaming or reordering a section here changes both.
#
# Fields:
#   id         the section's anchor, e.g. resources.html#topics. Keep it short, no spaces.
#   category   matches `category:` in _resources/*.md
#   title      the section heading
#   style      card (boxed cards) or link-item (a simple list)
#   summary    optional one line, shown under the title in the Resources popup
#   intro      optional paragraph under the heading on the Resources page
#   featured_intro / featured_detail
#              optional highlighted box under the heading (used by the overview section)
#   home_card  optional; true puts this section on the home page's Resources card
#              (its title and summary). Give it to one section only.
#   popup      optional; false leaves this section out of the Resources popup

- id: organizations
  category: orgs-and-refs
  title: "Organizations & reference"
  style: card

- id: topics
  category: topics
  title: "Topic collections"
  style: card
  summary: "Readings, exercises and assignments by ALife topic"
  intro: "Readings, exercises, and assignments organized by ALife topic. Feel free to cross-link if a resource is relevant to two different lists. Comment to add materials!"
  home_card: true

- id: courses
  category: courses
  title: "Courses & curricula"
  style: link-item
  intro: "Online courses, syllabi, and structured learning materials related to Artificial Life. If you teach an ALife course and want it listed here, reach out via the community Discord."

- id: explorables
  category: explorables
  title: "Explorables & interactives"
  style: card
  intro: "Interactive simulations, explorable explanations, and browser-based tools that illustrate ALife concepts — useful for teaching, demos, and self-directed learning. Coming soon."

- id: labs
  category: labs
  title: "Schools & labs"
  style: card
  intro: "Universities, research labs, and groups with active programs or significant work in Artificial Life. If your lab or institution should be listed here, let us know via the community Discord. Coming soon."

- id: overview
  category: overview
  title: "ALife overview & introductions"
  style: card
  featured_intro: "High-level overviews of Artificial Life as a field — what it studies, why it matters, and how it connects to biology, computer science, philosophy, and education."
  featured_detail: "This section will feature introductory content produced by Imy, along with other community-contributed overview materials. Content is being developed alongside the AEDU and TAL workshops and will be added here as it becomes available."

- id: pedagogy
  category: pedagogy
  title: "Pedagogy"
  style: link-item
  intro: "Pedagogical considerations and tools relevant or in the context of an alife class. These ideas and tools are generally relevant to all pedagogy, but this is a collection of them specifically tailored to an alife class."
