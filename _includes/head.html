<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<title>{% if page.collection == "events" %}{{ page.card_title | default: page.nav_label }} — ALife-Edu{% else %}{{ page.title }}{% endif %}</title>
{% if page.description %}<meta name="description" content="{{ page.description | strip_html }}">{% endif %}
<!-- Apply a saved light/dark choice before the page draws (see js/theme.js) -->
<script>try { if (localStorage.getItem('theme') === 'light') document.documentElement.setAttribute('data-theme', 'light'); } catch (e) {}</script>
<script src="js/theme.js" defer></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Lexend:wght@300;400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/nav.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/hero.css">
<link rel="stylesheet" href="css/buttons.css">
<link rel="stylesheet" href="css/cards.css">
<link rel="stylesheet" href="css/blocks.css">
<link rel="stylesheet" href="css/dates.css">
<link rel="stylesheet" href="css/footer.css">
<link rel="stylesheet" href="css/responsive.css">
{% for css in page.extra_css %}<link rel="stylesheet" href="{{ css }}">
{% endfor %}
